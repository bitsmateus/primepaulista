server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota cai no index.html (React Router cuida do resto)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache de assets com hash: pode cachear por muito tempo, o nome muda a cada build
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html, service worker e manifest do PWA: nunca cachear no navegador/CDN.
  # É por eles que o cliente descobre que há uma versão nova depois de um deploy —
  # se ficarem em cache, um F5 simples não é suficiente.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
